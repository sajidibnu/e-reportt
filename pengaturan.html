  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E_report!</title>
    <link rel="stylesheet" href="boostrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>

   <nav class="navbar topbar px-4">
        <span class="navbar-brand text-white fw-bold">
            E_report <span class="brand-light">santri</span> 
        </span>
        <div class="admin-profile">
            <div class="">
                <span>Admin</span> 
                <small>pengelola sistem</small>
            </div>
            <div class="admin-avatar">AD</div>
        </div>

   </nav>

   <div class="row">
       <aside class="sidebar col-lg-2 p-4">
       <h5 class="menu-label">menu</h5>
        <a href="index.html" class="menu-link"> <i class="bi bi-bar-chart"></i> Dashboard</a>
        <a href="statistik.html" class="menu-link "> <i class="bi bi-clipboard-data"></i> Data laporan</a>
        <a href="pengaturan.html" class="menu-link active"> <i class="bi bi-gear"></i> Pengaturan</a>
       </aside>
       <main class="col-lg-10 p-4"> 
            <h2>Pengaturan sistem</h2>
            <p>Kelola informasi admin</p>

            <div class="row">
                <div class="col-lg-6">
                    <div class="card h-100">
                        <div class="card-header">
                            <h5>  <i class="bi bi-person-circle"></i> Administrator  </h5>
                        </div>
                        <div class="card-body">
                            <form action="">
                                <div class="mb-3"> 
                                    <label for="">Nama admin</label>
                                    <input type="text"  value="sajid" class="form-control">
                                </div>
                                <div class="mb-3"> 
                                    <label for="">Email</label>
                                    <input type="text"  value="Admin@idn.com" class="form-control">
                                </div>
                                <div class="mb-3"> 
                                    <label for="">Jabatan</label>
                                    <input type="text"  value="Administrator" class="form-control">
                                </div>
                                <button class="btn btn-primary">
                                    <i class="bi bi-floppy"></i>
                                    simpan profil
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="card h-100">
                        <div class="card-header">
                            <h5>  <i class="bi bi-person-circle"></i>Nama aplikasi</h5>
                        </div>
                        <div class="card-body">
                            <form action="">
                                <div class="mb-3"> 
                                    <label for="">Nama aplikasi </label>
                                    <input type="text"  value="E-report santri" class="form-control">
                                </div>
                                <div class="mb-3"> 
                                    <label for="">Nama sekolah</label>
                                    <input type="text"  value="IDNBS" class="form-control">
                                </div>
                                <div class="mb-3"> 
                                    <label for="">Deskripsi aplikasi</label>
                                    <input type="text"  value="Sistem pelaporan pelanggaran santri" class="form-control">
                                </div>
                                <button class="btn btn-primary">
                                    <i class="bi bi-check"></i>
                                    simpan identitas
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                              <div>
                                <h5>
                                  <i class="bi bi-bell text-warning"></i> 
                                  Preferensi sistem 
                                </h5>
                              </div>
                              <div class="form-check form-switch">
                                <input type="checkbox" class="form-check-input">
                                <label for="" class="form-check-label">
                                    aktifkan notifikasi
                                </label>
                              </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    

   <script src="boostrap/js/bootstrap.bundle.min.js"></script>
     
</body>
</html>
