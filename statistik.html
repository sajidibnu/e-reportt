 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E_report!</title>
    <link rel="stylesheet" href="boostrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>

   <nav class="navbar topbar px-4">
        <span class="navbar-brand text-white fw-bold">
            E_report <span class="brand-light">santri</span> 
        </span>
        <div class="admin-profile">
            <div class="">
                <span>Admin</span> 
                <small>pengelola sistem</small>
            </div>
            <div class="admin-avatar">AD</div>
        </div>

   </nav>

   <div class="row">
       <aside class="sidebar col-lg-2 p-4">
       <h5 class="menu-label">menu</h5>
        <a href="index.html" class="menu-link"> <i class="bi bi-bar-chart"></i> Dashboard</a>
        <a href="statistik.html" class="menu-link"> <i class="bi bi-clipboard-data"></i> Data laporan</a>
        <a href="pengaturan.html" class="menu-link active"> <i class="bi bi-gear"></i> Pengaturan</a>
       </aside>
       <main class="col-lg-10 p-4"> 
           <h2>Data laporan statistik</h2>
           
            <div class="row">
              <div class="col-lg-8">
                <div class="card">
                  <div class="card-body">
                    <h5>statistik laporan</h5>
                    <p>jumlah laporan santri setiap bulan</p>

                    <canvas id="santriChart" height="300px"></canvas>
                  </div>
                </div>
              </div>
              <div class="col-lg-4">
                <div class="card">
                  <div class="card-body">
                    <h5>status laporan</h5>
                    <p>laporan santri</p>

                    <canvas id="rimuruChart" height="300px"></canvas>
                  </div>
                </div>
              </div>
            </div>

        </main>
    </div>
    

   <script src="boostrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      const ctx = document.getElementById('santriChart')

      new Chart(ctx,{
        type:'bar',
        data: {
          labels: ["januari","februari","maret","april","mei"],
          datasets: [{
            label: "jumlah laporan per-bulan",
            data: [20,11,30,22,100],
            backgroundColor: [
               'royalblue','red','yello','gold','black'
            ],
            borderWidth: 3
          }]
        },
        options:{
          plugins: {
            legend: {
              position: "bottom"
            }
          }
        }
                  
      })
    </script>

     <script>
      const rmc = document.getElementById('rimuruChart')

      new Chart(rmc,{
        type:'doughnut',
        data: {
          labels: ["menunggu","ditolak","setuju"],
          datasets: [{
            label: "jumlah laporan per-bulan",
            data: [30,20,50,],
            backgroundColor: [
               'blue','gold','black'
            ],
            borderWidth: 3
          }]
        },
        options:{
          plugins: {
            legend: {
              position: "bottom"
            }
          }
        }
                  
      })
    </script>
    
</body>
</html>
